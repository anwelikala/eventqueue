<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue Ticket System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2440; --ink-soft:#2B3560; --paper:#EFE9DC; --paper-dark:#E3DCC9;
    --amber:#D8912E; --amber-deep:#B87421; --teal:#2F7A6B; --rust:#B14A29;
    --board-digit:#F7F4EC; --line: rgba(27,36,64,0.14); --shadow: 0 18px 40px -18px rgba(27,36,64,0.35);
    --font-display:'Space Mono', 'Courier New', monospace;
    --font-body:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body); background:var(--paper); color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;}
  .app{min-height:100vh;display:flex;flex-direction:column;}

  .topline{display:flex;align-items:center;justify-content:space-between;padding:18px 24px; gap:12px; border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
  .brand .mark{font-family:var(--font-display);font-weight:700;background:var(--ink);color:var(--board-digit);padding:4px 8px;border-radius:4px;font-size:13px;letter-spacing:1px;flex-shrink:0;}
  .brand .title{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .home-link{font-size:13px;color:var(--ink-soft);text-decoration:none;border:1px solid var(--line);padding:8px 14px;border-radius:100px;font-weight:600;cursor:pointer;background:transparent;font-family:var(--font-body);flex-shrink:0;}
  .home-link:hover{border-color:var(--ink);}
  .center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 56px;}
  button{font-family:var(--font-body);}

  .landing-title{font-size:clamp(30px,4.5vw,44px);font-weight:800;margin:0 0 8px;text-align:center;}
  .landing-sub{color:#5b5f73;font-size:15px;margin:0 0 36px;max-width:480px;text-align:center;}
  .hero-card{background:var(--ink); color:var(--board-digit); border-radius:24px; padding:52px 56px; box-shadow: 0 30px 60px -20px rgba(27,36,64,0.5); display:flex; flex-direction:column; align-items:center; gap:16px; max-width:420px; width:100%; position:relative; overflow:hidden;}
  @media (max-width:520px){ .hero-card{padding:44px 28px;} }
  .hero-card::before{content:"";position:absolute;top:-40%;right:-30%;width:220px;height:220px;background:radial-gradient(circle, rgba(216,145,46,0.35), transparent 70%);}
  .hero-icon{width:52px;height:52px;border-radius:15px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--ink);}
  .hero-card h2{margin:0;font-size:22px;}
  .hero-card p{margin:0;font-size:13px;color:rgba(247,244,236,0.7);line-height:1.5;text-align:center;}
  .hero-btn{margin-top:8px; width:100%; background:var(--amber); color:var(--ink); border:none; padding:20px 28px; border-radius:14px; font-family:var(--font-body); font-size:18px; font-weight:800; cursor:pointer; letter-spacing:0.2px;}

  .board-card{margin-top:16px; display:flex; align-items:center; gap:16px; text-align:left; background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 22px; max-width:420px; width:100%; box-shadow:var(--shadow); cursor:pointer; font-family:var(--font-body); transition:transform .15s ease;}
  .board-card:hover{transform:translateY(-2px);}
  .board-card .icon{width:42px;height:42px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center; flex-shrink:0; font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--board-digit);}
  .board-card h3{margin:0 0 3px;font-size:15px;color:var(--ink);}
  .board-card p{margin:0;font-size:13px;color:#8a8d9e;}

  .page-footer{display:flex; justify-content:center; align-items:center; gap:14px; padding:20px; border-top:1px solid var(--line); font-size:13px; color:#8a8d9e;}
  .page-footer button{background:none; border:none; color:#8a8d9e; font-size:13px; cursor:pointer; text-decoration:underline; font-family:var(--font-body); padding:0;}
  .page-footer button:hover{ color:var(--ink-soft); }
  .page-footer .sep{color:var(--line);}

  .ticket-chip-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:18px; max-width:460px; }
  .ticket-chip{ background:#fff; border:1.5px solid var(--line); color:var(--ink-soft); padding:8px 14px; border-radius:100px; font-size:12px; font-weight:700; cursor:pointer; font-family:var(--font-body); }
  .ticket-chip:hover{ border-color:var(--ink); color:var(--ink); }

  .form-card{background:#fff;border-radius:18px;padding:40px 34px;text-align:left;box-shadow:var(--shadow);max-width:420px;width:100%;}
  .form-card h2{margin:0 0 8px;font-size:22px;text-align:center;}
  .form-card > p.intro{margin:0 0 24px;color:#5b5f73;font-size:14px;line-height:1.55;text-align:center;}
  label.field-label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#8a8d9e;margin-bottom:8px;}
  .field-group{margin-bottom:18px;}
  input.text-input, select.text-input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);font-size:15px;font-family:var(--font-body);background:#fff;}
  optgroup{font-weight:700;color:var(--ink);font-style:normal;}
  input.text-input:focus, select.text-input:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}
  .field-error{color:var(--rust);font-size:13px;margin:-10px 0 16px;display:none;}
  .field-error.show{display:block;}
  .privacy-note{margin:16px 0 0;font-size:12px;line-height:1.5;color:#8a8d9e;text-align:center;}

  .ticket-wrap{width:100%;max-width:380px;}
  .ticket{position:relative;background:#fff;border-radius:4px;padding:36px 28px 30px;text-align:center;box-shadow:var(--shadow);background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(27,36,64,0.05) 28px);}
  .ticket::before, .ticket::after{content:"";position:absolute;top:50%;transform:translateY(-50%);width:24px;height:24px;background:var(--paper);border-radius:50%;}
  .ticket::before{left:-12px;} .ticket::after{right:-12px;}
  .ticket .perf{position:absolute;left:14px;right:14px;top:0;height:0;border-top:2px dashed var(--line);}
  .ticket-eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--amber-deep);font-weight:700;margin-bottom:10px;}
  .counter-tag{display:inline-block; background:var(--ink); color:var(--board-digit); font-size:11px; font-weight:700; padding:4px 12px; border-radius:100px; letter-spacing:0.5px; margin-bottom:10px;}
  .ticket-number{font-family:var(--font-display);font-weight:700;font-size:76px;line-height:1;color:var(--ink);margin:2px 0 10px;letter-spacing:2px;}
  .ticket-hint{font-size:14px;color:#5b5f73;margin:0 0 6px;line-height:1.5;}
  .ticket-service{font-size:14px;color:var(--ink-soft);font-weight:700;margin:0 0 10px;}
  .ticket-notice{font-size:12px;color:#8a8d9e;margin:10px 0 0;line-height:1.5;}
  .ticket-divider{border-top:2px dashed var(--line);margin:18px 0;}
  .ticket-meta{font-size:12px;color:#8a8d9e;text-transform:uppercase;letter-spacing:1px;text-align:center;}
  .ahead-pill{display:inline-block;margin-top:16px;background:var(--paper-dark);padding:8px 16px;border-radius:100px;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .ahead-pill.turn{background:#DCEEE8;color:var(--teal);}
  .ahead-pill.passed{background:#F5DCC9;color:var(--rust);}

  .mini-board{position:relative; overflow:hidden; background:var(--ink); border-radius:18px; margin-top:16px; padding:22px 20px; text-align:center; box-shadow:var(--shadow);}
  .mini-label{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--amber);font-weight:700;position:relative;z-index:2;}
  .mini-number{font-family:var(--font-display);font-weight:700;font-size:56px;line-height:1.2;color:var(--board-digit); position:relative; z-index:2;}
  .mini-number.pulse{ animation:miniPulse 900ms ease; }
  @media (prefers-reduced-motion: reduce){ .mini-number.pulse{ animation:none; } }
  @keyframes miniPulse{ 0%{ transform:scale(1); text-shadow:0 0 0 rgba(216,145,46,0); } 35%{ transform:scale(1.08); text-shadow:0 0 30px rgba(216,145,46,0.6); } 100%{ transform:scale(1); text-shadow:0 0 0 rgba(216,145,46,0); } }
  .mini-ring{position:absolute; top:50%; left:50%; width:50px; height:50px; border:3px solid var(--amber); border-radius:50%; transform:translate(-50%,-50%) scale(0.3); opacity:0; pointer-events:none; z-index:1;}
  .mini-ring.go{ animation:miniRipple 1000ms ease-out; }
  .mini-ring.go.r2{ animation-delay:130ms; } .mini-ring.go.r3{ animation-delay:260ms; }
  @media (prefers-reduced-motion: reduce){ .mini-ring.go{ animation:none; } }
  @keyframes miniRipple{ 0%{ transform:translate(-50%,-50%) scale(0.3); opacity:0.8; } 100%{ transform:translate(-50%,-50%) scale(6); opacity:0; } }

  .board-view{background:var(--ink);color:var(--board-digit);flex:1;display:flex;flex-direction:column;position:relative;}
  .board-view .topline{border-bottom:1px solid rgba(247,244,236,0.14);}
  .board-view .brand .mark{background:var(--amber);color:var(--ink);}
  .board-view .brand .title{color:var(--board-digit);}
  .board-view .home-link{color:var(--board-digit);border-color:rgba(247,244,236,0.35);}
  .board-view .home-link:hover{border-color:var(--board-digit);}
  .board-columns{flex:1; display:flex; flex-wrap:wrap; align-items:stretch;}
  .board-panel{flex:1; min-width:260px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:24px 16px; position:relative; border-right:1px solid rgba(247,244,236,0.12);}
  .board-panel:last-child{border-right:none;}
  .board-clabel{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:rgba(247,244,236,0.65);font-weight:700;position:relative;z-index:2;}
  .serving-label{font-size:clamp(14px,2vw,18px);letter-spacing:5px;text-transform:uppercase;color:var(--amber);font-weight:700;position:relative;z-index:2;}
  .serving-number{font-family:var(--font-display);font-weight:700;font-size:clamp(70px,14vw,150px);line-height:1;color:var(--board-digit);position:relative;z-index:2;}
  .serving-number.pulse{animation:pulse 900ms ease;}
  @media (prefers-reduced-motion: reduce){ .serving-number.pulse{animation:none;} }
  @keyframes pulse{ 0%{ transform:scale(1); text-shadow: 0 0 0 rgba(216,145,46,0); } 35%{ transform:scale(1.05); text-shadow: 0 0 60px rgba(216,145,46,0.55); } 100%{ transform:scale(1); text-shadow: 0 0 0 rgba(216,145,46,0); } }
  .ripple-ring{position:absolute; top:50%; left:50%; width:100px; height:100px; border:4px solid var(--amber); border-radius:50%; transform:translate(-50%,-50%) scale(0.3); opacity:0; pointer-events:none; z-index:1;}
  .ripple-ring.go{ animation:rippleGo 1100ms ease-out; }
  .ripple-ring.go.r2{ animation-delay:150ms; } .ripple-ring.go.r3{ animation-delay:300ms; }
  @media (prefers-reduced-motion: reduce){ .ripple-ring.go{ animation:none; } }
  @keyframes rippleGo{ 0%{ transform:translate(-50%,-50%) scale(0.3); opacity:0.8; } 100%{ transform:translate(-50%,-50%) scale(5); opacity:0; } }
  .board-sub{font-size:14px;color:rgba(247,244,236,0.6);position:relative;z-index:2;}
  .board-footer{text-align:center;padding:18px;font-size:12px;color:rgba(247,244,236,0.4);letter-spacing:1px;text-transform:uppercase;}
  .sound-banner{display:block; width:100%; border:none; cursor:pointer; background:var(--amber); color:var(--ink); font-family:var(--font-body); font-weight:700; font-size:14px; padding:12px; text-align:center;}
  .sound-banner:hover{ filter:brightness(1.05); }

  .counter-choice{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:16px; }
  .counter-choice button{background:#fff; border:2px solid var(--ink); color:var(--ink); font-weight:800; font-size:15px; padding:20px 26px; border-radius:14px; cursor:pointer; font-family:var(--font-body); min-width:150px;}
  .counter-choice button:hover{ background:var(--ink); color:var(--board-digit); }
  .switch-counter-link{background:none;border:none;color:#8a8d9e;font-size:12px;cursor:pointer;text-decoration:underline;font-family:var(--font-body);margin-top:14px;}

  .panel-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:22px;max-width:1240px;width:100%;}
  @media (max-width:760px){ .panel-grid{grid-template-columns:1fr;} }
  .panel{background:#fff;border-radius:18px;padding:28px;box-shadow:var(--shadow);}
  .panel h3{margin:0 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:#8a8d9e;}
  .stat-row{display:flex;gap:16px;margin-top:18px;flex-wrap:wrap;}
  .stat{flex:1;min-width:100px;background:var(--paper);border-radius:14px;padding:16px;text-align:center;}
  .stat .num{font-family:var(--font-display);font-weight:700;font-size:28px;}
  .stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8a8d9e;margin-top:4px;}
  .counter-stat-block{margin-top:18px;}
  .counter-stat-block h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);}
  .call-next-btn{width:100%;margin-top:22px;padding:22px;font-size:20px;border-radius:16px;}
  .btn-row{display:flex;gap:10px;margin-top:12px;}
  .btn-row .ghost-btn{flex:1;}
  .ghost-btn{background:transparent;color:var(--ink);border:1.5px solid var(--ink);padding:14px 26px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;}
  .rust-btn{background:transparent;color:var(--rust);border:1.5px solid var(--rust);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;}
  .save-row{display:flex;gap:10px;margin-top:12px;}
  .danger-zone{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);}
  .danger-zone p{font-size:13px;color:#8a8d9e;margin:0 0 12px;}
  .wide-panel{max-width:1240px;width:100%;}

  .service-group{background:var(--paper);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
  .service-group h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);}
  .service-group .sub{font-size:11px;color:#8a8d9e;margin:0 0 10px;}
  .service-chip-list{display:flex;flex-wrap:wrap;gap:8px;}
  .service-chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:100px;padding:8px 8px 8px 14px;font-size:13px;margin:0;}
  .chip-remove{background:none;border:none;color:var(--rust);font-size:16px;line-height:1;cursor:pointer;padding:2px 6px;font-weight:700;}
  .chip-remove:hover{color:#fff;background:var(--rust);border-radius:50%;}
  .counter-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .counter-row input{max-width:160px;}
  .counter-row input.prefix-input{max-width:70px;}

  .table-scroll{overflow-x:auto;margin-top:18px;}
  table.visitor-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:700px;}
  table.visitor-table th{text-align:left;padding:8px 8px;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#8a8d9e;border-bottom:1.5px solid var(--line);}
  table.visitor-table td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap;}
  table.visitor-table td.service-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
  table.visitor-table tr:last-child td{border-bottom:none;}
  .status-pill{display:inline-block;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:700;}
  .status-pill.waiting{background:var(--paper-dark);color:var(--ink-soft);}
  .status-pill.called{background:#DCEEE8;color:var(--teal);}
  .status-pill.active{background:#DCEEE8;color:var(--teal);}
  .status-pill.paused{background:#F5DCC9;color:var(--rust);}
  .table-action-btn{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);padding:5px 12px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-body);}
  .table-action-btn.primary{border-color:var(--teal);color:var(--teal);}
  .table-action-btn:hover{border-color:var(--ink);color:var(--ink);}
  .empty-note{color:#8a8d9e;font-size:14px;margin-top:18px;text-align:center;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--board-digit);padding:12px 22px;border-radius:100px;font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .offline-banner{background:var(--rust);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:8px;display:none;}
  .offline-banner.show{display:block;}
</style>
</head>
<body>

<div class="offline-banner" id="offline-banner">Can't reach the server — retrying…</div>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const OTHER_PREFIX = '__other__::';

  let state = { title: 'Queue', welcomeMessage:'', ticketMessage:'', privacyNotice:'', counters: [], services: [], registrationPaused:false, pausedMessage:'', updatedAt:0 };
  let view = 'landing';
  let myCounterId = null, myTicketNumber = null, myCounterSeq = null, myService = null;
  let pollTimer = null;
  let ticketServingSeen = null, ticketRecallSeen = null;
  let boardTrack = {}; // { [counterId]: { serving, recall } }

  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const offlineBanner = document.getElementById('offline-banner');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }
  function setOffline(isOffline){ offlineBanner.classList.toggle('show', isOffline); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtTime(ts){
    if(!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function isValidPhone(phone){
    if(!/^[0-9+\-()\s]+$/.test(phone)) return false;
    const digitCount = (phone.match(/\d/g) || []).length;
    return digitCount >= 7 && digitCount <= 15;
  }
  function validateName(name){
    const trimmed = name.trim().replace(/\s+/g, ' ');
    const parts = trimmed.split(' ').filter(Boolean);
    if(parts.length < 2) return 'Please enter both your first and last name.';
    const partPattern = /^[\p{L}'’\-.]+$/u;
    for(const part of parts){
      if(!partPattern.test(part)) return 'Enter your name using letters only.';
      const lettersOnly = part.replace(/[^\p{L}]/gu, '').toLowerCase();
      if(lettersOnly.length > 0 && /^(.)\1+$/u.test(lettersOnly)) return 'Enter your name using letters only.';
    }
    const anyPartLongEnough = parts.some(p => p.replace(/[^\p{L}]/gu, '').length > 3);
    if(!anyPartLongEnough) return 'Your first or last name should be more than 3 characters.';
    return null;
  }
  function counterById(id){ return (state.counters || []).find(c => c.id === id); }

  // Device tickets: one ticket per counter per device, remembered in
  // localStorage (persists across browser restarts). Shape:
  // { [counterId]: { ticketNumber, counterSeq } }
  const DEVICE_TICKETS_KEY = 'queueDeviceTickets';
  function getStoredTickets(){
    try{
      const raw = localStorage.getItem(DEVICE_TICKETS_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function storeTickets(map){
    try{ localStorage.setItem(DEVICE_TICKETS_KEY, JSON.stringify(map)); }catch(e){ /* ignore */ }
  }
  function saveDeviceTicket(counterId, ticketNumber, counterSeq, service){
    const map = getStoredTickets();
    map[counterId] = { ticketNumber, counterSeq, service };
    storeTickets(map);
  }
  function isAdminLoggedIn(){ return !!sessionStorage.getItem('adminPassword'); }

  async function apiCall(path, opts){
    try{
      const res = await fetch(path, opts);
      setOffline(false);
      return res;
    }catch(err){
      console.error('Network error on', path, err);
      setOffline(true);
      throw err;
    }
  }
  function authHeaders(kind){
    const pw = sessionStorage.getItem(kind + 'Password') || '';
    return { 'x-app-password': pw };
  }
  function handleAuthFailure(kind){
    sessionStorage.removeItem(kind + 'Password');
    if(kind === 'call') sessionStorage.removeItem('callCounterId');
    showToast('Password no longer valid — please log in again.');
    goto(kind === 'call' ? 'call-login' : 'admin-login');
  }

  const api = {
    getState: async () => (await apiCall('/api/state')).json(),

    callLogin: async (password) => (await apiCall('/api/call/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password })
    })).json(),
    callState: async () => {
      const res = await apiCall('/api/call/state', { headers: authHeaders('call') });

  function startPolling(renderFn){
    stopPolling();
    pollTimer = setInterval(async ()=>{
      try{ await renderFn(true); }catch(e){ /* handled inside */ }

  function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
  function goto(v){ stopPolling(); view = v; render(); }

  /* ---------------- REGISTER FLOW ---------------- */
  async function openRegisterFlow(){
    stopPolling();
    try{ state = await api.getState(); }catch(e){ /* fall back to cached state */ }

    const counters = state.counters || [];
    const tickets = getStoredTickets();
    const validEntries = counters
      .map(c => ({ counter: c, t: tickets[c.id] }))
      .filter(x => x.t && Number.isInteger(x.t.counterSeq) && x.t.counterSeq <= x.counter.lastIssued);
    // Prune stale entries (e.g. after a reset) so they don't linger forever.
    const prunedMap = {};
    validEntries.forEach(x => { prunedMap[x.counter.id] = x.t; });
    storeTickets(prunedMap);

    const allCovered = counters.length > 0 && validEntries.length === counters.length;
    if(allCovered && !isAdminLoggedIn()){
      renderMyTickets(validEntries);
      return;
    }
    if(state.registrationPaused){
      renderPaused();
      return;
    }
    view = 'register';
    renderRegister(validEntries);
  }

      const isOther = serviceSelect.value.startsWith(OTHER_PREFIX);
      otherGroup.style.display = isOther ? 'block' : 'none';
      otherInput.required = isOther;
      if(!isOther) otherInput.value = '';
    };

    document.getElementById('register-form').onsubmit = async (e)=>{
      e.preventDefault();
      const name = document.getElementById('f-name').value.trim();
      const phone = document.getElementById('f-phone').value.trim();
      const selectedValue = serviceSelect.value;
      const errEl = document.getElementById('form-error');

      if(!name || !phone || !selectedValue){
        errEl.textContent = 'Please fill in all fields.';
        errEl.classList.add('show');
        return;
      }
      const nameError = validateName(name);
      if(nameError){
        errEl.textContent = nameError;
        errEl.classList.add('show');
        return;
      }
      if(!isValidPhone(phone)){
        errEl.textContent = 'Enter a valid phone number (digits only, at least 7 digits).';
        errEl.classList.add('show');
        return;
      }

      let counterId, service;
      if(selectedValue.startsWith(OTHER_PREFIX)){
        counterId = selectedValue.slice(OTHER_PREFIX.length);
        service = otherInput.value.trim();
        if(!service){
          errEl.textContent = 'Please tell us what you need help with.';
          errEl.classList.add('show');
          return;

      } else {
        const svc = (state.services || []).find(s => s.name === selectedValue);
        if(!svc){
          errEl.textContent = 'Please choose a valid service.';
          errEl.classList.add('show');
          return;

        counterId = svc.counterId;
        service = svc.name;
      }
      errEl.classList.remove('show');

      // If this device already holds a valid ticket for this specific
      // counter, don't issue a second one — show the existing ticket.
      const existing = getStoredTickets()[counterId];
      const counter = counterById(counterId);
      if(existing && counter && existing.counterSeq <= counter.lastIssued && !isAdminLoggedIn()){

      try{
        const res = await apiCall('/api/register', {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, phone, service, counterId })

        const result = await res.json();

        enableSound();
        renderTicket();
        startPolling(pollTicketUpdate);
      }catch(err){
        showToast("Couldn't reach the server — try again.");
      }
    };
  }

  function formatCounterNumber(counter, seq){
    if(!counter || !counter.prefix) return String(seq).padStart(3,'0');
    return `${counter.prefix}-${String(seq).padStart(3,'0')}`;
  }
  function updateTicketAheadCount(){
    const pillEl = document.getElementById('ahead-pill');
    const numEl = document.getElementById('mini-serving-num');
    const counter = counterById(myCounterId);
    if(!pillEl || !numEl || !counter) return;
    numEl.textContent = formatCounterNumber(counter, counter.nowServing);

    let text, cls;
    if(counter.nowServing > myCounterSeq){
      text = 'Your number has already been called — please check with staff';
      cls = 'passed';
    } else if(counter.nowServing === myCounterSeq){
      text = "It's your turn — please come forward";
      cls = 'turn';
    } else if(counter.nowServing === myCounterSeq - 1){
      text = "You're next";
      cls = 'next';
    } else {
      const ahead = myCounterSeq - counter.nowServing - 1;
      text = ahead + ' number' + (ahead === 1 ? '' : 's') + ' ahead of you';
      cls = 'ahead';
    }
    pillEl.textContent = text;
    pillEl.className = 'ahead-pill ' + cls;
  }
  function fireTicketRipple(){
    ['t-ring1','t-ring2','t-ring3'].forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
    });
    const numEl = document.getElementById('mini-serving-num');
    if(numEl){ numEl.classList.remove('pulse'); void numEl.offsetWidth; numEl.classList.add('pulse'); }
  }
  async function pollTicketUpdate(){
    state = await api.getState();
    const counter = counterById(myCounterId);
    if(!counter) return;
    const changed = counter.nowServing !== ticketServingSeen;
    const recalled = counter.lastRecallAt && counter.lastRecallAt !== ticketRecallSeen;
    ticketServingSeen = counter.nowServing;
    if(recalled){ ticketRecallSeen = counter.lastRecallAt; }
    updateTicketAheadCount();
    if(changed || recalled){ fireTicketRipple(); playChime(); }
  }

  /* ---------------- SOUND ---------------- */
  let audioCtx = null;
  let soundEnabled = false;
  function enableSound(){
    try{
      if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
      soundEnabled = true;
    }catch(e){ /* Web Audio unavailable — sound just won't play */ }
  }
  function playChime(){
    if(!soundEnabled || !audioCtx) return;
    try{
      const now = audioCtx.currentTime;
      [880, 1108.73].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const start = now + i * 0.16;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.9, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.45);
      });
    }catch(e){ /* ignore playback errors */ }
  }
  function fireRipple(counterId){
    ['ring1','ring2','ring3'].forEach(id=>{
      const el = document.getElementById(id + '_' + counterId);
      if(!el) return;
      el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
    });
  }

              <div class="board-sub" id="board-sub_${c.id}">${c.lastIssued > c.nowServing ? (c.lastIssued - c.nowServing) + ' waiting' : 'No one waiting'}</div>
            </div>
          `).join('')}
        </div>
        <div class="board-footer">${escapeHtml(state.title)}</div>
      </div>
    `;
    const soundBtn = document.getElementById('enable-sound-btn');
    if(soundBtn){
      soundBtn.onclick = ()=>{ enableSound(); playChime(); soundBtn.remove(); };
    }
    startPolling(async ()=>{
      state = await api.getState();
      (state.counters || []).forEach(c => {
        const track = boardTrack[c.id] || { serving: c.nowServing, recall: null };
        const changed = c.nowServing !== track.serving;
        const recalled = c.lastRecallAt && c.lastRecallAt !== track.recall;
        const numEl = document.getElementById('serving-num_' + c.id);
        const subEl = document.getElementById('board-sub_' + c.id);
        if(numEl && changed){
          numEl.textContent = formatCounterNumber(c, c.nowServing);
          numEl.classList.remove('pulse'); void numEl.offsetWidth; numEl.classList.add('pulse');
        }
        if(changed || recalled){ fireRipple(c.id); playChime(); }
        if(subEl){ subEl.textContent = c.lastIssued > c.nowServing ? (c.lastIssued - c.nowServing) + ' waiting' : 'No one waiting'; }
        boardTrack[c.id] = { serving: c.nowServing, recall: c.lastRecallAt || track.recall };
      });
    });
  }

      </div>
    `;
    if(toggleHelpedFn){
      wrap.querySelectorAll('.table-action-btn').forEach(btn=>{
        btn.onclick = async ()=>{
          const ticketNumber = btn.getAttribute('data-ticket');
          const helped = btn.getAttribute('data-helped') === 'true';
          try{
            const data = await toggleHelpedFn(ticketNumber, helped);
            renderVisitorTable(containerId, data.visitors, toggleHelpedFn);
          }catch(e){ /* handled */ }
        };
      });
    }
  }

  function render(){
    if(view === 'landing') renderLanding();
    else if(view === 'register') renderRegister();
    else if(view === 'display') renderDisplay();
    else if(view === 'call-login') renderCallLogin();
    else if(view === 'call-desk') enterCallDesk();
    else if(view === 'admin-login') renderAdminLogin();
    else if(view === 'admin-panel') renderAdminPanel();
  }

  window.__app = { goto, openRegisterFlow };

  (async function init(){
    try{ state = await api.getState(); }catch(e){ /* fall back to defaults, retried on poll */ }
    render();
  })();
})();
</script>
</body>
</html>
