<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue Ticket System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2440;
    --ink-soft:#2B3560;
    --paper:#EFE9DC;
    --paper-dark:#E3DCC9;
    --amber:#D8912E;
    --amber-deep:#B87421;
    --teal:#2F7A6B;
    --rust:#B14A29;
    --board-digit:#F7F4EC;
    --line: rgba(27,36,64,0.14);
    --shadow: 0 18px 40px -18px rgba(27,36,64,0.35);
    --font-display:'Space Mono', 'Courier New', monospace;
    --font-body:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- shared bits ---------- */
  .topline{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px; gap:12px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
  .brand .mark{
    font-family:var(--font-display);font-weight:700;
    background:var(--ink);color:var(--board-digit);
    padding:4px 8px;border-radius:4px;font-size:13px;letter-spacing:1px;
    flex-shrink:0;
  }
  .brand .title{
    font-weight:700;font-size:16px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
  }
  .home-link{
    font-size:13px;color:var(--ink-soft);text-decoration:none;
    border:1px solid var(--line);padding:8px 14px;border-radius:100px;
    font-weight:600;cursor:pointer;background:transparent;
    font-family:var(--font-body);flex-shrink:0;
  }
  .home-link:hover{border-color:var(--ink);}
  .center-col{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px 56px;
  }
  button{font-family:var(--font-body);}
  .primary-btn{
    background:var(--ink);color:var(--board-digit);
    border:none;padding:18px 34px;border-radius:14px;
    font-size:17px;font-weight:700;cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .primary-btn:hover{transform:translateY(-2px);}
  .primary-btn:active{transform:translateY(0);}
  .primary-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .ghost-btn{
    background:transparent;color:var(--ink);border:1.5px solid var(--ink);
    padding:14px 26px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .rust-btn{
    background:transparent;color:var(--rust);border:1.5px solid var(--rust);
    padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;
  }

  /* ---------- landing (hero) ---------- */
  .landing-title{font-size:clamp(30px,4.5vw,44px);font-weight:800;margin:0 0 8px;text-align:center;}
  .landing-sub{color:#5b5f73;font-size:15px;margin:0 0 40px;text-align:center;max-width:480px;}
  .hero-card{
    background:var(--ink); color:var(--board-digit);
    border-radius:24px; padding:56px 60px;
    box-shadow: 0 30px 60px -20px rgba(27,36,64,0.5);
    display:flex; flex-direction:column; align-items:center; gap:18px;
    max-width:420px; width:100%;
    position:relative; overflow:hidden;
  }
  @media (max-width:520px){ .hero-card{padding:44px 28px;} }
  .hero-card::before{
    content:"";position:absolute;top:-40%;right:-30%;width:220px;height:220px;
    background:radial-gradient(circle, rgba(216,145,46,0.35), transparent 70%);
  }
  .hero-icon{
    width:56px;height:56px;border-radius:16px;background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--ink);
  }
  .hero-card h2{margin:0;font-size:24px;}
  .hero-card p{margin:0;font-size:14px;color:rgba(247,244,236,0.7);line-height:1.5;text-align:center;}
  .hero-btn{
    margin-top:8px; width:100%;
    background:var(--amber); color:var(--ink); border:none;
    padding:20px 28px; border-radius:14px;
    font-family:var(--font-body); font-size:18px; font-weight:800;
    cursor:pointer; letter-spacing:0.2px;
  }

  .board-card{
    margin-top:16px;
    display:flex; align-items:center; gap:16px; text-align:left;
    background:#fff; border:1px solid var(--line); border-radius:18px;
    padding:18px 22px; max-width:420px; width:100%;
    box-shadow:var(--shadow); cursor:pointer;
    font-family:var(--font-body);
    transition:transform .15s ease;
  }
  .board-card:hover{transform:translateY(-2px);}
  .board-card .icon{
    width:42px;height:42px;border-radius:12px;background:var(--ink);
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
    font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--board-digit);
  }
  .board-card h3{margin:0 0 3px;font-size:15px;color:var(--ink);}
  .board-card p{margin:0;font-size:13px;color:#8a8d9e;}

  .page-footer{
    display:flex; justify-content:center; align-items:center; gap:14px;
    padding:20px; border-top:1px solid var(--line);
    font-size:13px; color:#8a8d9e;
  }
  .page-footer button{
    background:none; border:none; color:#8a8d9e; font-size:13px;
    cursor:pointer; text-decoration:underline; font-family:var(--font-body); padding:0;
  }
  .page-footer button:hover{ color:var(--ink-soft); }
  .page-footer .sep{color:var(--line);}

  /* ---------- forms (register + password gates) ---------- */
  .form-card{
    background:#fff;border-radius:18px;padding:40px 34px;text-align:left;
    box-shadow:var(--shadow);max-width:420px;width:100%;
  }
  .form-card h2{margin:0 0 8px;font-size:22px;text-align:center;}
  .form-card > p.intro{margin:0 0 24px;color:#5b5f73;font-size:14px;line-height:1.55;text-align:center;}
  label.field-label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#8a8d9e;margin-bottom:8px;}
  .field-group{margin-bottom:18px;}
  input.text-input, select.text-input{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);
    font-size:15px;font-family:var(--font-body);background:#fff;
  }
  input.text-input:focus, select.text-input:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}
  .field-error{color:var(--rust);font-size:13px;margin:-10px 0 16px;display:none;}
  .field-error.show{display:block;}

  /* ---------- ticket ---------- */
  .ticket-wrap{width:100%;max-width:380px;}
  .ticket{
    position:relative;background:#fff;border-radius:4px;
    padding:36px 28px 30px;text-align:center;
    box-shadow:var(--shadow);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(27,36,64,0.05) 28px);
  }
  .ticket::before, .ticket::after{
    content:"";position:absolute;top:50%;transform:translateY(-50%);
    width:24px;height:24px;background:var(--paper);border-radius:50%;
  }
  .ticket::before{left:-12px;}
  .ticket::after{right:-12px;}
  .ticket .perf{position:absolute;left:14px;right:14px;top:0;height:0;border-top:2px dashed var(--line);}
  .ticket-eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--amber-deep);font-weight:700;margin-bottom:14px;}
  .ticket-number{
    font-family:var(--font-display);font-weight:700;font-size:88px;line-height:1;
    color:var(--ink);margin:6px 0 10px;letter-spacing:2px;
  }
  .ticket-hint{font-size:14px;color:#5b5f73;margin:0 0 18px;line-height:1.5;}
  .ticket-divider{border-top:2px dashed var(--line);margin:18px 0;}
  .ticket-meta{display:flex;justify-content:space-between;font-size:12px;color:#8a8d9e;text-transform:uppercase;letter-spacing:1px;}
  .ahead-pill{
    display:inline-block;margin-top:16px;background:var(--paper-dark);
    padding:8px 16px;border-radius:100px;font-size:13px;font-weight:700;color:var(--ink-soft);
  }
  .mini-board{
    position:relative; overflow:hidden;
    background:var(--ink); border-radius:18px; margin-top:16px; padding:22px 20px;
    text-align:center; box-shadow:var(--shadow);
  }
  .mini-label{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--amber);font-weight:700;position:relative;z-index:2;}
  .mini-number{
    font-family:var(--font-display);font-weight:700;font-size:56px;line-height:1.2;
    color:var(--board-digit); position:relative; z-index:2;
  }
  .mini-number.pulse{ animation:miniPulse 900ms ease; }
  @media (prefers-reduced-motion: reduce){ .mini-number.pulse{ animation:none; } }
  @keyframes miniPulse{
    0%{ transform:scale(1); text-shadow:0 0 0 rgba(216,145,46,0); }
    35%{ transform:scale(1.08); text-shadow:0 0 30px rgba(216,145,46,0.6); }
    100%{ transform:scale(1); text-shadow:0 0 0 rgba(216,145,46,0); }
  }
  .mini-ring{
    position:absolute; top:50%; left:50%; width:50px; height:50px;
    border:3px solid var(--amber); border-radius:50%;
    transform:translate(-50%,-50%) scale(0.3); opacity:0; pointer-events:none; z-index:1;
  }
  .mini-ring.go{ animation:miniRipple 1000ms ease-out; }
  .mini-ring.go.r2{ animation-delay:130ms; }
  .mini-ring.go.r3{ animation-delay:260ms; }
  @media (prefers-reduced-motion: reduce){ .mini-ring.go{ animation:none; } }
  @keyframes miniRipple{
    0%{ transform:translate(-50%,-50%) scale(0.3); opacity:0.8; }
    100%{ transform:translate(-50%,-50%) scale(6); opacity:0; }
  }

  /* ---------- display board ---------- */
  .board-view{background:var(--ink);color:var(--board-digit);flex:1;display:flex;flex-direction:column;position:relative;}
  .board-view .topline{border-bottom:1px solid rgba(247,244,236,0.14);}
  .board-view .brand .mark{background:var(--amber);color:var(--ink);}
  .board-view .brand .title{color:var(--board-digit);}
  .board-view .home-link{color:var(--board-digit);border-color:rgba(247,244,236,0.35);}
  .board-view .home-link:hover{border-color:var(--board-digit);}
  .board-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;position:relative;}
  .serving-label{font-size:clamp(16px,2.6vw,22px);letter-spacing:6px;text-transform:uppercase;color:var(--amber);font-weight:700;position:relative;z-index:2;}
  .serving-number{
    font-family:var(--font-display);font-weight:700;
    font-size:clamp(120px,26vw,300px);line-height:1;color:var(--board-digit);
    position:relative;z-index:2;
  }
  .serving-number.pulse{animation:pulse 900ms ease;}
  @media (prefers-reduced-motion: reduce){ .serving-number.pulse{animation:none;} }
  @keyframes pulse{
    0%{ transform:scale(1); text-shadow: 0 0 0 rgba(216,145,46,0); }
    35%{ transform:scale(1.05); text-shadow: 0 0 60px rgba(216,145,46,0.55); }
    100%{ transform:scale(1); text-shadow: 0 0 0 rgba(216,145,46,0); }
  }
  .ripple-ring{
    position:absolute; top:50%; left:50%; width:120px; height:120px;
    border:4px solid var(--amber); border-radius:50%;
    transform:translate(-50%,-50%) scale(0.3); opacity:0; pointer-events:none; z-index:1;
  }
  .ripple-ring.go{ animation:rippleGo 1100ms ease-out; }
  .ripple-ring.go.r2{ animation-delay:150ms; }
  .ripple-ring.go.r3{ animation-delay:300ms; }
  @media (prefers-reduced-motion: reduce){ .ripple-ring.go{ animation:none; } }
  @keyframes rippleGo{
    0%{ transform:translate(-50%,-50%) scale(0.3); opacity:0.8; }
    100%{ transform:translate(-50%,-50%) scale(5.5); opacity:0; }
  }
  .board-sub{font-size:15px;color:rgba(247,244,236,0.6);position:relative;z-index:2;}
  .board-footer{text-align:center;padding:18px;font-size:12px;color:rgba(247,244,236,0.4);letter-spacing:1px;text-transform:uppercase;}
  .sound-banner{
    display:block; width:100%; border:none; cursor:pointer;
    background:var(--amber); color:var(--ink);
    font-family:var(--font-body); font-weight:700; font-size:14px;
    padding:12px; text-align:center;
  }
  .sound-banner:hover{ filter:brightness(1.05); }

  /* ---------- call desk + admin panels ---------- */
  .panel-grid{
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:22px;
    max-width:880px;width:100%;
  }
  @media (max-width:760px){ .panel-grid{grid-template-columns:1fr;} }
  .panel{background:#fff;border-radius:18px;padding:28px;box-shadow:var(--shadow);}
  .panel h3{margin:0 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:#8a8d9e;}
  .stat-row{display:flex;gap:16px;margin-top:18px;}
  .stat{flex:1;background:var(--paper);border-radius:14px;padding:16px;text-align:center;}
  .stat .num{font-family:var(--font-display);font-weight:700;font-size:34px;}
  .stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8a8d9e;margin-top:4px;}
  .call-next-btn{width:100%;margin-top:22px;padding:22px;font-size:20px;border-radius:16px;}
  .btn-row{display:flex;gap:10px;margin-top:12px;}
  .btn-row .ghost-btn{flex:1;}
  .save-row{display:flex;gap:10px;margin-top:12px;}
  .danger-zone{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);}
  .danger-zone p{font-size:13px;color:#8a8d9e;margin:0 0 12px;}
  .wide-panel{max-width:1080px;width:100%;}

  /* ---------- visitor table ---------- */
  .table-scroll{overflow-x:auto;margin-top:18px;}
  table.visitor-table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px;}
  table.visitor-table th{
    text-align:left;padding:10px 10px;font-size:11px;text-transform:uppercase;
    letter-spacing:0.5px;color:#8a8d9e;border-bottom:1.5px solid var(--line);
  }
  table.visitor-table td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.visitor-table tr:last-child td{border-bottom:none;}
  .status-pill{display:inline-block;padding:4px 10px;border-radius:100px;font-size:11px;font-weight:700;}
  .status-pill.waiting{background:var(--paper-dark);color:var(--ink-soft);}
  .status-pill.called{background:#DCEEE8;color:var(--teal);}
  .status-pill.active{background:#DCEEE8;color:var(--teal);}
  .status-pill.paused{background:#F5DCC9;color:var(--rust);}
  .empty-note{color:#8a8d9e;font-size:14px;margin-top:18px;text-align:center;}

  /* ---------- service chips (admin) ---------- */
  .service-chip-list{display:flex;flex-wrap:wrap;gap:8px;}
  .service-chip{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--paper);border-radius:100px;
    padding:8px 8px 8px 14px;font-size:13px;
  }
  .service-chip span{max-width:320px;}
  .chip-remove{
    background:none;border:none;color:var(--rust);font-size:16px;line-height:1;
    cursor:pointer;padding:2px 6px;font-weight:700;
  }
  .chip-remove:hover{color:#fff;background:var(--rust);border-radius:50%;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--board-digit);padding:12px 22px;border-radius:100px;
    font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .offline-banner{
    background:var(--rust);color:#fff;text-align:center;font-size:13px;font-weight:600;
    padding:8px;display:none;
  }
  .offline-banner.show{display:block;}
</style>
</head>
<body>

<div class="offline-banner" id="offline-banner">Can't reach the server — retrying…</div>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const OTHER_VALUE = '__other__';
  let state = { title: 'Queue', welcomeMessage: '', services: [], lastIssued: 0, nowServing: 0, updatedAt: 0 };
  let view = 'landing';
  let myTicket = null;
  let pollTimer = null;
  let lastServingSeen = null;
  let lastRecallSeen = null;
  let ticketServingSeen = null;

  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const offlineBanner = document.getElementById('offline-banner');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }
  function setOffline(isOffline){
    offlineBanner.classList.toggle('show', isOffline);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtTime(ts){
    if(!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function isValidPhone(phone){
    // Allow digits, spaces, +, -, ( ) — e.g. "+46 70 123 45 67" or "(011) 234-5678".
    // Reject anything else (letters, symbols) and require at least 7 digits total.
    if(!/^[0-9+\-()\s]+$/.test(phone)) return false;
    const digitCount = (phone.match(/\d/g) || []).length;
    return digitCount >= 7 && digitCount <= 15;
  }

  // One ticket per device: remembered in localStorage (persists across
  // browser restarts, unlike sessionStorage) so reloading or revisiting
  // doesn't let the same visitor pull a second number. Admins (logged into
  // the admin page on this device) are exempt, so staff can test freely.
  const DEVICE_TICKET_KEY = 'queueDeviceTicket';
  function getStoredTicket(){
    try{
      const raw = localStorage.getItem(DEVICE_TICKET_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function storeTicket(ticket){
    try{ localStorage.setItem(DEVICE_TICKET_KEY, JSON.stringify(ticket)); }catch(e){ /* ignore */ }
  }
  function clearStoredTicket(){
    try{ localStorage.removeItem(DEVICE_TICKET_KEY); }catch(e){ /* ignore */ }
  }
  function isAdminLoggedIn(){
    return !!sessionStorage.getItem('adminPassword');
  }

  async function apiCall(path, opts){
    try{
      const res = await fetch(path, opts);
      setOffline(false);
      return res;
    }catch(err){
      console.error('Network error on', path, err);
      setOffline(true);
      throw err;
    }
  }

  const api = {
    getState: async () => (await apiCall('/api/state')).json(),
    register: async (payload) => (await apiCall('/api/register', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
    })).json(),

    callLogin: async (password) => (await apiCall('/api/call/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password })
    })).json(),
    callState: async () => {
      const res = await apiCall('/api/call/state', { headers: authHeaders('call') });
      if(res.status === 401){ handleAuthFailure('call'); throw new Error('unauthorized'); }
      return res.json();
    },
    callNext: async () => {
      const res = await apiCall('/api/call/next', { method:'POST', headers: authHeaders('call') });
      if(res.status === 401){ handleAuthFailure('call'); throw new Error('unauthorized'); }
      return res.json();
    },
    callRecall: async () => {
      const res = await apiCall('/api/call/recall', { method:'POST', headers: authHeaders('call') });
      if(res.status === 401){ handleAuthFailure('call'); throw new Error('unauthorized'); }
      return res.json();
    },
    callVisitors: async () => {
      const res = await apiCall('/api/call/visitors', { headers: authHeaders('call') });
      if(res.status === 401){ handleAuthFailure('call'); throw new Error('unauthorized'); }
      return res.json();
    },

    adminLogin: async (password) => (await apiCall('/api/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password })
    })).json(),
    adminVisitors: async () => {
      const res = await apiCall('/api/admin/visitors', { headers: authHeaders('admin') });
      if(res.status === 401){ handleAuthFailure('admin'); throw new Error('unauthorized'); }
      return res.json();
    },
    adminSetTitle: async (title) => {
      const res = await apiCall('/api/admin/title', {
        method:'POST',
        headers: Object.assign({'Content-Type':'application/json'}, authHeaders('admin')),
        body: JSON.stringify({ title })
      });
      if(res.status === 401){ handleAuthFailure('admin'); throw new Error('unauthorized'); }
      return res.json();
    },
    adminSetWelcome: async (message) => {
      const res = await apiCall('/api/admin/welcome', {
        method:'POST',
        headers: Object.assign({'Content-Type':'application/json'}, authHeaders('admin')),
        body: JSON.stringify({ message })
      });
      if(res.status === 401){ handleAuthFailure('admin'); throw new Error('unauthorized'); }
      return res.json();
    },
    adminSetPause: async (paused) => {
      const res = await apiCall('/api/admin/pause', {
        method:'POST',
        headers: Object.assign({'Content-Type':'application/json'}, authHeaders('admin')),
        body: JSON.stringify({ paused })
      });
      if(res.status === 401){ handleAuthFailure('admin'); throw new Error('unauthorized'); }
      return res.json();
    },
    adminSetPauseMessage: async (message) => {
      const res = await apiCall('/api/admin/pause-message', {

      myTicket = stored.number;

      return;

    if(stored && !storedStillValid){
      // The queue was reset since this device's ticket was issued — it no

      clearStoredTicket();

  /* ---------------- SOUND (display board) ---------------- */
  let audioCtx = null;
  let soundEnabled = false;
  function enableSound(){
    try{
      if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
      soundEnabled = true;
    }catch(e){ /* Web Audio unavailable — sound just won't play */ }
  }
  function playChime(){
    if(!soundEnabled || !audioCtx) return;
    try{
      const now = audioCtx.currentTime;
      [880, 1108.73].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const start = now + i * 0.16;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.9, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.45);
      });
    }catch(e){ /* ignore playback errors */ }
  }
  function fireRipple(){
    ['ring1','ring2','ring3'].forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      el.classList.remove('go');
      void el.offsetWidth;
      el.classList.add('go');
    });
  }

      if(servingChanged){
        lastServingSeen = state.nowServing;
        numEl.textContent = String(state.nowServing).padStart(3,'0');
        numEl.classList.remove('pulse');
        void numEl.offsetWidth;
        numEl.classList.add('pulse');
      }
      if(recalled){ lastRecallSeen = state.lastRecallAt; }
      if(servingChanged || recalled){
        fireRipple();
        playChime();
      }
      if(subEl){ subEl.textContent = state.lastIssued > state.nowServing ? (state.lastIssued - state.nowServing) + ' waiting' : 'No one waiting'; }

        loadVisitors();
        renderAdminPanel();
      }catch(e){ /* handled */ }
    };
    document.getElementById('save-title-btn').onclick = async ()=>{
      const val = document.getElementById('title-input').value.trim();
      if(!val) return;
      try{
        state = await api.adminSetTitle(val);
        showToast('Event title saved');
      }catch(e){ /* handled */ }
    };
    document.getElementById('save-welcome-btn').onclick = async ()=>{
      const val = document.getElementById('welcome-input').value.trim();
      if(!val) return;
      try{
        state = await api.adminSetWelcome(val);
        showToast('Welcome message saved');
      }catch(e){ /* handled */ }
    };
    document.getElementById('pause-toggle-btn').onclick = async ()=>{
      try{
        state = await api.adminSetPause(!state.registrationPaused);
        showToast(state.registrationPaused ? 'Registration paused' : 'Registration resumed');
        renderAdminPanel();
      }catch(e){ /* handled */ }
    };
    document.getElementById('save-pause-message-btn').onclick = async ()=>{
      const val = document.getElementById('pause-message-input').value.trim();
      if(!val) return;
      try{
        state = await api.adminSetPauseMessage(val);
        showToast('Paused message saved');
      }catch(e){ /* handled */ }
    };

    function renderServicesList(){
      const wrap = document.getElementById('services-list-wrap');
      if(!wrap) return;
      const services = state.services || [];
      if(services.length === 0){
        wrap.innerHTML = `<p class="empty-note">No services added yet — visitors will only see "Other".</p>`;
        return;
      }
      wrap.innerHTML = `
        <div class="service-chip-list">
          ${services.map(s => `
            <div class="service-chip">
              <span>${escapeHtml(s)}</span>
              <button class="chip-remove" type="button" data-service="${escapeHtml(s)}" aria-label="Remove ${escapeHtml(s)}">×</button>
            </div>
          `).join('')}
        </div>
      `;
      wrap.querySelectorAll('.chip-remove').forEach(btn=>{
        btn.onclick = async ()=>{
          try{
            state = await api.adminRemoveService(btn.getAttribute('data-service'));
            renderServicesList();
            showToast('Service removed');
          }catch(e){ /* handled */ }
        };
      });
    }
    document.getElementById('add-service-btn').onclick = async ()=>{
      const input = document.getElementById('new-service-input');
      const val = input.value.trim();
      if(!val) return;
      try{
        state = await api.adminAddService(val);
        input.value = '';
        renderServicesList();
        showToast('Service added');
      }catch(e){ /* handled */ }
    };
    renderServicesList();

    document.getElementById('download-csv-btn').onclick = async ()=>{
      try{
        const res = await apiCall('/api/admin/export', { headers: authHeaders('admin') });
        if(res.status === 401){ handleAuthFailure('admin'); return; }
        const text = await res.text();
        const blob = new Blob([text], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'visitors.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }catch(e){ showToast("Couldn't download the CSV — try again."); }
    };

    const importInput = document.getElementById('upload-csv-input');
    const importErrorNote = document.getElementById('import-error-note');
    document.getElementById('upload-csv-btn').onclick = ()=> importInput.click();
    importInput.onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      importErrorNote.classList.remove('show');
      importErrorNote.style.display = 'none';
      if(!confirm('This replaces the entire visitor list on the server with what\'s in this file. Continue?')){
        importInput.value = '';
        return;
      }
      try{
        const text = await file.text();
        const result = await api.adminImportVisitors(text);
        if(result.error){
          importErrorNote.textContent = result.error + (result.details && result.details.length ? ' ' + result.details.join(' · ') : '');
          importErrorNote.style.display = 'block';
        }else{
          state = result.state;
          showToast(`Imported ${result.count} visitor${result.count === 1 ? '' : 's'}`);
          loadVisitors();
          renderAdminPanel();
        }
      }catch(err){
        importErrorNote.textContent = "Couldn't read or upload that file.";
        importErrorNote.style.display = 'block';
      }
      importInput.value = '';
    };

    async function loadVisitors(){
      try{
        const data = await api.adminVisitors();
        renderVisitorTable('visitor-table-wrap', data.visitors);
      }catch(e){ /* handled */ }
    }

    loadVisitors();
    startPolling(loadVisitors);
  }

  // Shared read-only visitor table renderer, used by both the admin page
  // and the call desk's read-only visitor list.
  function renderVisitorTable(containerId, visitors){
    const wrap = document.getElementById(containerId);
    if(!wrap) return;
    if(!visitors || visitors.length === 0){
      wrap.innerHTML = `<p class="empty-note">No one has registered yet.</p>`;
      return;
    }
    const rows = visitors.slice().reverse().map(v => `
      <tr>
        <td>${String(v.number).padStart(3,'0')}</td>
        <td>${escapeHtml(v.name || '—')}</td>
        <td>${escapeHtml(v.phone || '—')}</td>
        <td>${escapeHtml(v.service || '—')}</td>
        <td>${fmtTime(v.registeredAt)}</td>
        <td><span class="status-pill ${v.calledAt ? 'called' : 'waiting'}">${v.calledAt ? 'Called' : 'Waiting'}</span></td>
      </tr>
    `).join('');
    wrap.innerHTML = `
      <div class="table-scroll">
        <table class="visitor-table">
          <thead>
            <tr><th>#</th><th>Name</th><th>Phone</th><th>Needs help with</th><th>Registered</th><th>Status</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  function render(){
    if(view === 'landing') renderLanding();
    else if(view === 'register') renderRegister();
    else if(view === 'display') renderDisplay();
    else if(view === 'call-login') renderCallLogin();
    else if(view === 'call-desk') renderCallDesk();
    else if(view === 'admin-login') renderAdminLogin();
    else if(view === 'admin-panel') renderAdminPanel();
  }

  window.__app = { goto, openRegister };

  (async function init(){
    try{ state = await api.getState(); }catch(e){ /* fall back to defaults, retried on poll */ }
    render();
  })();
})();
</script>
</body>
</html>
